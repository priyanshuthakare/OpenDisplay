[package]
name = "usbdisplay-streamer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
usbdisplay-transport = { path = "../../transport" }
usbdisplay-protocol = { path = "../../protocol" }
usbdisplay-encoder = { path = "../encoder" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
