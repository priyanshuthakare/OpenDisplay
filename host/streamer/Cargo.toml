[package]
name = "usbdisplay-streamer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rcgen = "0.14"
rustls = "0.23"
rustls-pki-types = "1.11"
rustls-native-certs = "0.7"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
usbdisplay-transport = { path = "../../transport" }
usbdisplay-protocol = { path = "../../protocol" }
usbdisplay-encoder = { path = "../encoder" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
